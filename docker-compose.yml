
services:
  # Web Application & Apache Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-apache-ecommerce
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - ecommerce-network

  # MySQL Database Container
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: laravel_ecommerce
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: user_password_here
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ecommerce-network

  # Background Queue Worker (ปรับมาดึงงานจากฐานข้อมูล MySQL แทน)
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    # รันคิวโดยใช้ไดรเวอร์ database
    command: php artisan queue:work database --queue=high,default --tries=3
    depends_on:
      - mysql
    networks:
      - ecommerce-network

volumes:
  mysql-data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge